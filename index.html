<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穎寶＆美美｜學習冒險島</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#2f3542;--muted:#6b7280;--blue:#6da8ff;--purple:#7866ff;
  --bg1:#fff9ef;--bg2:#eef8ff;--line:#e5e9f0;--soft:#f6f8fc;
}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%,#f7f1ff);color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:14px}
.hero,.panel{background:#fff;border-radius:26px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.07)}
.hero{text-align:center}.hero h1{margin:4px 0 0;font-size:clamp(29px,5vw,46px)}
.sub{color:var(--muted);margin-top:8px}.panel{margin-top:16px}
.step{font-size:22px;font-weight:900;margin:2px 0 15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{border:2px solid transparent;border-radius:19px;padding:16px 12px;cursor:pointer;
font-size:19px;font-weight:900;transition:.15s;background:var(--soft);color:var(--ink);min-height:68px}
.btn:hover{transform:translateY(-2px)}.btn.reading{background:#fff1cd}
.back{border:0;background:#eef2f8;color:#384152;font-weight:900;border-radius:14px;padding:10px 14px;cursor:pointer;margin-bottom:13px}
.primary{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff}
.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.badge{background:var(--soft);border-radius:999px;padding:9px 14px;font-weight:900}
.progress{height:12px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:14px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#5ba7ff,#8d7cff)}
.question{font-size:clamp(25px,5.2vw,46px);font-weight:900;text-align:center;margin:25px 0;line-height:1.35}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.answer{border:2px solid var(--line);background:#fff;border-radius:18px;min-height:70px;
font-size:21px;font-weight:900;cursor:pointer;padding:12px}
.answer.correct{border-color:#39b86d;background:#ebfff1}.answer.wrong{border-color:#ef6a6a;background:#fff0f0}
.feedback{min-height:33px;text-align:center;font-weight:900;margin-top:15px}
.explain{font-size:15px;color:#667085;text-align:center;margin-top:6px}
.next{display:block;margin:15px auto 0;border:none;border-radius:16px;padding:13px 22px;
background:#705cff;color:#fff;font-weight:900;font-size:17px;cursor:pointer}
.hidden{display:none!important}.result{text-align:center}.result h2{font-size:32px}
.wrong-list{text-align:left;background:#fafafa;border-radius:16px;padding:14px;margin-top:14px;line-height:1.7}
.story{background:linear-gradient(180deg,#fffaf0,#fff);border:2px solid #f2dfb7;border-radius:22px;
padding:20px;font-size:20px;line-height:1.9;margin:12px 0 18px}
.story h2{text-align:center;margin:0 0 10px}.storyMeta{text-align:center;color:#8a6d2f;font-weight:800;margin-bottom:8px}
.info{background:#eef7ff;border-radius:16px;padding:12px 14px;color:#526070;font-size:14px;line-height:1.6}
@media(max-width:640px){.grid,.answers{grid-template-columns:1fr}.wrap{padding:9px}.panel,.hero{border-radius:20px;padding:15px}.answer{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div style="font-size:44px">🏝️📚🎮</div>
    <h1>穎寶＆美美｜學習冒險島</h1>
    <div class="sub">長期題庫版｜動態出題・近期避重複・短篇閱讀</div>
  </div>

  <section id="gradeScreen" class="panel">
    <div class="step">① 選年級</div>
    <div class="grid">
      <button class="btn" onclick="chooseGrade(1)">一年級</button>
      <button class="btn" onclick="chooseGrade(2)">二年級</button>
      <button class="btn" onclick="chooseGrade(3)">三年級</button>
    </div>
    <div class="info" style="margin-top:14px">
      系統會記住這台裝置最近玩過的題目，下一局優先換新題；數學會自動換數字，因此不是固定幾百題玩完就結束。
    </div>
  </section>

  <section id="subjectScreen" class="panel hidden">
    <button class="back" onclick="show('gradeScreen')">⬅ 回上一層</button>
    <div class="step"><span id="gradeTitle"></span>｜② 選科目</div>
    <div class="grid" id="subjectGrid"></div>
  </section>

  <section id="levelScreen" class="panel hidden">
    <button class="back" onclick="show('subjectScreen')">⬅ 回上一層</button>
    <div class="step"><span id="subjectTitle"></span>｜③ 選難度</div>
    <div class="grid">
      <button class="btn" onclick="chooseLevel('初級')">🌱 初級</button>
      <button class="btn" onclick="chooseLevel('中級')">🔥 中級</button>
      <button class="btn" onclick="chooseLevel('困難')">👑 困難</button>
    </div>
  </section>

  <section id="storyListScreen" class="panel hidden">
    <button class="back" onclick="show('subjectScreen')">⬅ 回上一層</button>
    <div class="step"><span id="storyGrade"></span>｜📚 短篇故事閱讀</div>
    <div class="grid" id="storyCards"></div>
  </section>

  <section id="storyScreen" class="panel hidden">
    <button class="back" onclick="show('storyListScreen')">⬅ 回故事選單</button>
    <div class="story">
      <h2 id="storyTitle"></h2>
      <div class="storyMeta" id="storyMeta"></div>
      <div id="storyText"></div>
    </div>
    <button class="btn primary" style="width:100%" onclick="startStoryQuiz()">我看完了，開始答題 ✨</button>
  </section>

  <section id="game" class="panel hidden">
    <button class="back" onclick="exitGame()">⬅ 回上一層選單</button>
    <div class="topbar">
      <div class="badge" id="modeLabel"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="badge">⭐ <span id="score">0</span></div>
        <div class="badge">🔥 Combo <span id="combo">0</span></div>
        <div class="badge">第 <span id="num">1</span>/<span id="total">10</span> 題</div>
      </div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <button id="nextBtn" class="next hidden">下一題 ➜</button>
  </section>

  <section id="result" class="panel hidden result">
    <div style="font-size:60px" id="resultEmoji">🏆</div>
    <h2>闖關完成！</h2>
    <div id="resultText"></div>
    <div id="wrongBox" class="wrong-list hidden"></div>
    <button id="retryWrong" class="next hidden">錯題再挑戰 🔁</button>
    <button id="again" class="next">同一關再玩一次 🎮</button>
    <button id="backMenu" class="next" style="background:#eef2f8;color:#384152">回上一層選單 ⬅</button>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const screens=['gradeScreen','subjectScreen','levelScreen','storyListScreen','storyScreen','game','result'];
function show(id){screens.forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function randint(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function q(id,text,answer,options,explain){return {id,text,answer:String(answer),options:options.map(String),explain}}
function wrongOptions(ans,spread=4){
  const set=new Set([ans]);
  while(set.size<4){let x=ans+randint(-spread,spread);if(x>=0)set.add(x)}
  return shuffle([...set]);
}
const state={grade:null,subject:null,level:null,mode:'normal',selectedStory:null,questions:[],index:0,score:0,combo:0,wrong:[],locked:false,lastSource:[]};

/* ---------- 最近題目避重複 ---------- */
const RECENT_KEY='learningGameRecentV3';
function getRecent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){return[]}}
function saveRecent(ids){
  const old=getRecent(), merged=[...ids,...old.filter(x=>!ids.includes(x))].slice(0,220);
  localStorage.setItem(RECENT_KEY,JSON.stringify(merged));
}
function chooseFresh(pool,count){
  const recent=new Set(getRecent());
  const unique=[];
  const seen=new Set();
  for(const item of pool){
    if(!seen.has(item.id)){seen.add(item.id);unique.push(item)}
  }
  let fresh=shuffle(unique.filter(x=>!recent.has(x.id)));
  let old=shuffle(unique.filter(x=>recent.has(x.id)));
  return [...fresh,...old].slice(0,count);
}

/* ---------- 選單 ---------- */
function chooseGrade(g){
  state.grade=g;$('gradeTitle').textContent=`${g}年級`;
  const subs=g<3?[['📖 國語','國語'],['➕ 數學','數學'],['🌱 生活','生活社會'],['📚 短篇閱讀','閱讀']]
                :[['📖 國語','國語'],['➕ 數學','數學'],['🌏 社會','生活社會'],['📚 短篇閱讀','閱讀']];
  $('subjectGrid').innerHTML=subs.map(([a,b])=>`<button class="btn ${b==='閱讀'?'reading':''}" onclick="chooseSubject('${b}')">${a}</button>`).join('');
  show('subjectScreen');
}
function chooseSubject(s){
  state.subject=s;
  if(s==='閱讀'){renderStoryCards();show('storyListScreen');return}
  const label=s==='生活社會'?(state.grade<3?'生活':'社會'):s;
  $('subjectTitle').textContent=`${state.grade}年級｜${label}`;show('levelScreen');
}
function chooseLevel(l){state.level=l;state.mode='normal';startNormalGame()}

/* ---------- 數學：動態產生，組合數非常大 ---------- */
function makeMathPool(g,l){
  const out=[];
  const add=(id,text,ans,opts,exp)=>out.push(q(id,text,ans,opts,exp));
  for(let i=0;i<90;i++){
    if(g===1){
      let a=randint(0,10),b=randint(0,10-a),ans=a+b;
      if(l==='初級') add(`m1e-a-${a}-${b}`,`${a} + ${b} = ?`,ans,wrongOptions(ans,3),`${a} + ${b} = ${ans}。`);
      else if(l==='中級'){
        const names=['小安','小美','小宇','小晴','小恩']; const item=pick(['貼紙','糖果','積木','鉛筆','小球']);
        add(`m1m-${a}-${b}-${item}`,`${pick(names)}有 ${a} 個${item}，又得到 ${b} 個，現在有幾個？`,ans,wrongOptions(ans,3),`用加法：${a}+${b}=${ans}。`);
      }else{
        let c=randint(0,Math.min(5,ans)),final=ans-c;
        add(`m1h-${a}-${b}-${c}`,`先有 ${a} 顆糖，又拿到 ${b} 顆，再吃掉 ${c} 顆，最後有幾顆？`,final,wrongOptions(final,3),`${a}+${b}-${c}=${final}。`);
      }
    }else if(g===2){
      if(l==='初級'){
        let a=randint(10,89),b=randint(1,99-a),ans=a+b;
        add(`m2e-${a}-${b}`,`${a} + ${b} = ?`,ans,wrongOptions(ans,8),`${a}+${b}=${ans}。`);
      }else if(l==='中級'){
        let a=randint(30,99),b=randint(5,a-1),ans=a-b;
        add(`m2m-${a}-${b}`,`有 ${a} 元，買東西用了 ${b} 元，還剩多少元？`,ans,wrongOptions(ans,8),`${a}-${b}=${ans}。`);
      }else{
        let a=randint(20,80),b=randint(5,30),c=randint(2,20),ans=a-b+c;
        add(`m2h-${a}-${b}-${c}`,`有 ${a} 張貼紙，送出 ${b} 張，又得到 ${c} 張，最後有幾張？`,ans,wrongOptions(ans,10),`${a}-${b}+${c}=${ans}。`);
      }
    }else{
      if(l==='初級'){
        let a=randint(100,800),b=randint(10,199),ans=a+b;
        add(`m3e-${a}-${b}`,`${a} + ${b} = ?`,ans,wrongOptions(ans,20),`${a}+${b}=${ans}。`);
      }else if(l==='中級'){
        let n=randint(2,9),m=randint(2,9),ans=n*m;
        add(`m3m-mul-${n}-${m}`,`${n} × ${m} = ?`,ans,wrongOptions(ans,8),`${n}×${m}=${ans}。`);
        let price=randint(20,80),qty=randint(2,5),sum=price*qty;
        add(`m3m-money-${price}-${qty}`,`每本筆記本 ${price} 元，買 ${qty} 本要多少元？`,sum,wrongOptions(sum,20),`${price}×${qty}=${sum}。`);
      }else{
        let n=randint(3,9),m=randint(3,9),extra=randint(5,30),ans=n*m+extra;
        add(`m3h-${n}-${m}-${extra}`,`有 ${n} 盒貼紙，每盒 ${m} 張，又多收到 ${extra} 張，共有幾張？`,ans,wrongOptions(ans,15),`${n}×${m}+${extra}=${ans}。`);
      }
    }
  }
  return out;
}

/* ---------- 國語：大量受控題型 ---------- */
const vocab={
1:[
 ['開心','快樂','難過'],['安靜','寧靜','吵鬧'],['大','巨大','小'],['快','迅速','慢'],['漂亮','美麗','醜陋'],
 ['勇敢','不害怕困難','膽小'],['整齊','整潔','凌亂'],['明亮','光亮','昏暗'],['溫暖','暖和','寒冷'],['友善','親切','兇惡']
],
2:[
 ['努力','認真去做','偷懶'],['迅速','很快','緩慢'],['寧靜','安靜','吵鬧'],['巨大','龐大','微小'],['珍惜','好好愛護','浪費'],
 ['合作','一起完成','各做各的'],['鼓勵','給予支持','責備'],['整潔','乾淨有序','凌亂'],['清新','清爽舒服','混濁'],['期待','盼望','排斥']
],
3:[
 ['專心','集中注意力','分心'],['欣賞','用心觀看感受','忽略'],['堅持','持續不放棄','放棄'],['自律','不需提醒也做好','依賴提醒'],['負責','承擔自己該做的事','逃避'],
 ['謹慎','小心注意','粗心'],['豐富','內容多且充實','單調'],['壯觀','景象雄偉','平凡'],['珍惜','重視並愛護','浪費'],['毅力','持續努力的力量','三分鐘熱度']
]};
const scenes=[
 ['小安看到同學忘記帶鉛筆，主動借給他。','樂於助人','主動幫助有需要的同學。'],
 ['小美把最後一塊餅乾分給弟弟。','願意分享','把自己的東西分給別人。'],
 ['小宇每天不用提醒就先完成作業。','自律','不需別人提醒也會完成。'],
 ['小晴打翻水後立刻拿抹布擦乾淨。','負責','自己處理造成的問題。'],
 ['小恩比賽失敗後繼續練習。','有毅力','失敗後仍繼續努力。'],
 ['大家意見不同時輪流說明想法。','懂得溝通','願意表達也願意傾聽。'],
 ['姐姐看到地上垃圾就撿進垃圾桶。','愛整潔','主動維護環境。'],
 ['弟弟上台前深呼吸讓自己冷靜。','調整情緒','用方法讓緊張情緒穩定。'],
 ['哥哥想買玩具，但決定先存零用錢。','能克制衝動','想買仍能延後消費。'],
 ['全班一起分工完成海報。','合作','大家分工一起完成任務。']
];
function makeChinesePool(g,l){
  const out=[];
  vocab[g].forEach((v,i)=>{
    out.push(q(`c${g}-${l}-syn-${i}`,`「${v[0]}」較接近哪個意思？`,v[1],[v[1],v[2],pick(['很甜','很重','很高','很遠']),pick(['睡覺','跑步','喝水','唱歌'])],`「${v[0]}」較接近「${v[1]}」。`));
  });
  scenes.forEach((s,i)=>{
    if(l==='初級'){
      out.push(q(`c${g}-${l}-scene-${i}`,`${s[0]} 這個行為比較像？`,s[1],[s[1],pick(['粗心','膽小','懶惰']),pick(['愛遲到','愛生氣','不守規矩']),pick(['怕黑','想睡覺','很吵'])],s[2]));
    }else if(l==='中級'){
      out.push(q(`c${g}-${l}-why-${i}`,`${s[0]} 從這件事可以看出？`,s[1],[s[1],pick(['不負責','愛拖延','只顧自己']),pick(['粗心','膽小','懶惰']),pick(['生氣','害怕','疲累'])],s[2]));
    }else{
      out.push(q(`c${g}-${l}-infer-${i}`,`${s[0]} 最適合用哪個詞形容這個人物？`,s[1],[s[1],pick(['依賴別人','容易放棄','自私']),pick(['粗心','衝動','沒耐心']),pick(['緊張','疲倦','沉默'])],s[2]));
    }
  });
  const seq=[
   ['媽媽先洗菜，再切菜，最後下鍋。','洗菜','先洗菜，再切菜。'],
   ['小明先穿襪子，再穿鞋子。','穿襪子','先襪子再鞋子。'],
   ['放學後先寫功課，再整理書包。','寫功課','先完成功課。'],
   ['先收好玩具，再去洗澡。','收玩具','第一件事是收玩具。'],
   ['先看題目，再開始作答。','看題目','作答前先看題目。']
  ];
  seq.forEach((s,i)=>out.push(q(`c${g}-${l}-seq-${i}`,`${s[0]} 第一件事是？`,s[1],[s[1],pick(['睡覺','看電視','吃點心']),pick(['洗澡','跑步','唱歌']),pick(['回家','聊天','畫圖'])],s[2])));
  return out;
}

/* ---------- 生活 / 社會：情境題庫 ---------- */
const lifePool=[
 ['過馬路時','走斑馬線並注意號誌','交通安全'],
 ['搭汽車時','繫安全帶','乘車安全'],
 ['在圖書館裡','輕聲說話','公共禮貌'],
 ['吃飯以前','先洗手','衛生習慣'],
 ['借別人的東西前','先詢問','尊重別人物品'],
 ['看到同學跌倒','先關心並找大人協助','關心他人'],
 ['和家人走散','留在安全處找工作人員','走失處理'],
 ['陌生人要求你跟他走','拒絕並找可信任大人','自我保護'],
 ['地震正在搖晃','趴下、掩護、穩住','防災'],
 ['刷牙時不用水','關掉水龍頭','節約用水'],
 ['看到公共設施損壞','告訴大人或管理人員','公共安全'],
 ['同學意見不同','輪流說明並傾聽','溝通合作'],
 ['使用公共物品後','放回原位','公共責任'],
 ['網路陌生人詢問住址','不要提供並告訴大人','網路安全'],
 ['垃圾分類時','依規定放入正確類別','環境保護']
];
const socialPool=[
 ['圖書館','借閱書籍與閱讀'],
 ['消防局','救火與救援'],
 ['郵局','寄送信件或包裹'],
 ['醫院','看診與照顧病人'],
 ['警察局','維護治安與協助民眾'],
 ['市場','購買日常食物用品'],
 ['公園','休閒與運動'],
 ['學校','學習與成長'],
 ['地圖上的上方','北方'],
 ['地圖上的方向標示','幫助辨認方向']
];
function makeLifeSocialPool(g,l){
  const out=[];
  if(g<3){
    lifePool.forEach((x,i)=>{
      const bad=shuffle(lifePool.filter((_,j)=>j!==i).map(y=>y[1])).slice(0,3);
      out.push(q(`ls${g}-${l}-${i}`,`${x[0]}，較適合怎麼做？`,x[1],[x[1],...bad],`這題重點：${x[2]}。`));
    });
  }else{
    socialPool.forEach((x,i)=>{
      const bad=shuffle(socialPool.filter((_,j)=>j!==i).map(y=>y[1])).slice(0,3);
      out.push(q(`s3-${l}-${i}`,`${x[0]}主要和哪一項有關？`,x[1],[x[1],...bad],`${x[0]}：${x[1]}。`));
    });
    lifePool.slice(5).forEach((x,i)=>{
      const bad=shuffle(lifePool.filter(y=>y[1]!==x[1]).map(y=>y[1])).slice(0,3);
      out.push(q(`s3-life-${l}-${i}`,`${x[0]}，比較適合？`,x[1],[x[1],...bad],`公共生活中要兼顧安全、規則與尊重。`));
    });
  }
  return out;
}

/* ---------- 閱讀：每年級 30 篇，故事內容由資料組合產生 ---------- */
const chars=['小安','小美','小宇','小晴','小恩','小杰','小語','小睿','小樂','小庭'];
const places=['學校','公園','圖書館','市場','社區活動中心','操場','教室','家裡','河堤步道','博物館'];
const themes=[
 ['撿到物品','把撿到的東西交給老師或服務人員','誠實'],
 ['同學需要幫忙','主動伸出援手','助人'],
 ['練習遇到困難','每天多練一點最後進步','毅力'],
 ['和朋友意見不同','輪流說明想法最後找到共同方法','溝通'],
 ['看到環境髒亂','主動整理並提醒大家一起維護','責任'],
 ['忘記帶東西','先冷靜再向老師或家人求助','解決問題'],
 ['準備上台報告','事前練習並深呼吸','勇氣'],
 ['存零用錢','忍住衝動先存下來','自制'],
 ['照顧植物','每天澆水並觀察變化','耐心'],
 ['團隊比賽','彼此鼓勵並完成分工','合作']
];
function makeStory(g,i){
  const c=chars[i%chars.length],p=places[(i*3+g)%places.length],t=themes[(i*7+g)%themes.length];
  const titlePool=['一次特別的經驗','今天我學會了','小小的選擇','沒有放棄的一天','原來可以這樣做','我們一起完成','一件值得記住的事','意外的小插曲','慢慢變好的方法','那天的收穫'];
  let text='';
  if(g===1){
    text=`${c}來到${p}，遇到「${t[0]}」的情況。一開始他不知道怎麼辦，先停下來想一想。後來，他選擇${t[1]}。事情順利解決後，${c}很開心，也記住了這次的經驗。`;
  }else if(g===2){
    text=`星期${['一','二','三','四','五','六','日'][i%7]}，${c}在${p}遇到「${t[0]}」的情況。剛開始他有些著急，但沒有馬上放棄。他先觀察發生了什麼事，再決定${t[1]}。最後事情順利解決，${c}發現遇到問題時，先冷靜想方法往往比慌張更有用。`;
  }else{
    text=`${c}在${p}遇到一件讓他印象很深的事：${t[0]}。起初他覺得有點為難，也想過乾脆算了，但仔細想過後，他決定${t[1]}。過程並不一定馬上順利，不過他一步一步調整做法，最後完成了原本想做的事。回家路上，${c}發現真正重要的不只是結果，而是自己在過程中學會了「${t[2]}」。`;
  }
  const title=`${titlePool[i%titlePool.length]} ${i+1}`;
  const questions=[
    q(`story-${g}-${i}-1`,`${c}在哪裡遇到事情？`,p,[p,...shuffle(places.filter(x=>x!==p)).slice(0,3)],`故事地點是${p}。`),
    q(`story-${g}-${i}-2`,`${c}遇到什麼情況？`,t[0],[t[0],...shuffle(themes.filter(x=>x[0]!==t[0]).map(x=>x[0])).slice(0,3)],`故事中遇到的是「${t[0]}」。`),
    q(`story-${g}-${i}-3`,`${c}後來怎麼做？`,t[1],[t[1],...shuffle(themes.filter(x=>x[1]!==t[1]).map(x=>x[1])).slice(0,3)],`他選擇${t[1]}。`),
    q(`story-${g}-${i}-4`,`這篇故事最接近哪個主題？`,t[2],[t[2],...shuffle(themes.filter(x=>x[2]!==t[2]).map(x=>x[2])).slice(0,3)],`故事重點是「${t[2]}」。`),
    q(`story-${g}-${i}-5`,`從故事中可以學到什麼？`,`遇到事情先想方法再行動`,['遇到事情先想方法再行動','遇到問題立刻逃走','任何事都交給別人','只要生氣就能解決'],`先冷靜思考、再採取適當行動。`)
  ];
  return {id:`story-${g}-${i}`,title,text,questions};
}
const storyBank={1:[],2:[],3:[]};
for(let g=1;g<=3;g++)for(let i=0;i<30;i++)storyBank[g].push(makeStory(g,i));

function renderStoryCards(){
  $('storyGrade').textContent=`${state.grade}年級`;
  const recent=new Set(getRecent());
  const ordered=[...storyBank[state.grade]].sort((a,b)=>(recent.has(a.id)?1:0)-(recent.has(b.id)?1:0));
  $('storyCards').innerHTML=ordered.map((s,i)=>`<button class="btn reading" onclick="openStory('${s.id}')">📖 ${s.title}<br><span style="font-size:14px;color:#7a8492">短篇閱讀＋5題</span></button>`).join('');
}
function openStory(id){
  state.selectedStory=storyBank[state.grade].find(x=>x.id===id);
  $('storyTitle').textContent=state.selectedStory.title;
  $('storyMeta').textContent=`${state.grade}年級閱讀`;
  $('storyText').textContent=state.selectedStory.text;show('storyScreen');
}
function startStoryQuiz(){
  state.mode='reading';state.subject='閱讀';state.level='故事閱讀';
  saveRecent([state.selectedStory.id]);
  launch(state.selectedStory.questions);
}

/* ---------- 遊戲流程 ---------- */
function getPool(){
  if(state.subject==='數學')return makeMathPool(state.grade,state.level);
  if(state.subject==='國語')return makeChinesePool(state.grade,state.level);
  if(state.subject==='生活社會')return makeLifeSocialPool(state.grade,state.level);
  return [];
}
function startNormalGame(){
  const pool=getPool();
  if(pool.length<10){alert('題庫不足，請稍後再試。');return}
  launch(chooseFresh(pool,10));
}
function launch(list){
  state.questions=shuffle(list);
  state.index=0;state.score=0;state.combo=0;state.wrong=[];state.locked=false;
  $('score').textContent='0';$('combo').textContent='0';$('total').textContent=state.questions.length;
  const label=state.subject==='生活社會'?(state.grade<3?'生活':'社會'):state.subject;
  $('modeLabel').textContent=state.mode==='reading'?`${state.grade}年級｜📚 ${state.selectedStory.title}`:`${state.grade}年級｜${label}｜${state.level}`;
  show('game');renderQuestion();
}
function renderQuestion(){
  state.locked=false;const item=state.questions[state.index];
  $('num').textContent=state.index+1;$('bar').style.width=`${state.index/state.questions.length*100}%`;
  $('question').textContent=item.text;$('feedback').textContent='';$('explain').textContent='';$('nextBtn').classList.add('hidden');
  $('answers').innerHTML='';
  shuffle(item.options).forEach(opt=>{
    const b=document.createElement('button');b.className='answer';b.textContent=opt;
    b.onclick=()=>answer(b,opt,item);$('answers').appendChild(b);
  });
}
function answer(btn,opt,item){
  if(state.locked)return;state.locked=true;
  const all=[...document.querySelectorAll('.answer')];all.forEach(b=>b.disabled=true);
  if(String(opt)===item.answer){
    btn.classList.add('correct');state.score++;state.combo++;
    $('feedback').textContent=state.combo>=3?'🎉 連續答對！太棒了！':'✅ 答對了！得到 1 顆星星';
  }else{
    btn.classList.add('wrong');state.combo=0;state.wrong.push(item);
    all.forEach(b=>{if(b.textContent===item.answer)b.classList.add('correct')});
    $('feedback').textContent=`💡 正確答案：${item.answer}`;
  }
  $('score').textContent=state.score;$('combo').textContent=state.combo;$('explain').textContent=item.explain||'';
  $('nextBtn').textContent=state.index===state.questions.length-1?'看成績 🏆':'下一題 ➜';$('nextBtn').classList.remove('hidden');
}
$('nextBtn').onclick=()=>{if(state.index<state.questions.length-1){state.index++;renderQuestion()}else finish()};
function finish(){
  saveRecent(state.questions.map(x=>x.id));
  show('result');const total=state.questions.length,pct=Math.round(state.score/total*100);
  $('resultEmoji').textContent=pct===100?'👑':pct>=80?'🌟':pct>=60?'👏':'💪';
  $('resultText').innerHTML=`答對 <b>${state.score} / ${total}</b> 題｜正確率 <b>${pct}%</b>｜得到 ⭐ <b>${state.score}</b>`;
  if(state.wrong.length){
    $('wrongBox').classList.remove('hidden');
    $('wrongBox').innerHTML='<b>這次的錯題：</b><br>'+state.wrong.map((x,i)=>`${i+1}. ${x.text} → ${x.answer}`).join('<br>');
    $('retryWrong').classList.remove('hidden');
  }else{$('wrongBox').classList.add('hidden');$('retryWrong').classList.add('hidden')}
}
$('retryWrong').onclick=()=>launch([...state.wrong]);
$('again').onclick=()=>{if(state.mode==='reading')launch(state.selectedStory.questions);else startNormalGame()};
$('backMenu').onclick=()=>exitGame();
function exitGame(){if(state.mode==='reading')show('storyListScreen');else show('levelScreen')}
</script>
