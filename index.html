<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穎寶＆美美｜學習冒險島</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  background:linear-gradient(180deg,#fff9ef,#eef8ff 55%,#f7f1ff);
  color:#2f3542;
}
.wrap{max-width:980px;margin:auto;padding:20px}
.hero{
  background:white;border-radius:28px;padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center
}
h1{margin:0;font-size:clamp(28px,5vw,46px)}
.sub{color:#6b7280;margin-top:8px}
.panel{
  margin-top:18px;background:#fff;border-radius:24px;padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.07)
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btn{
  border:none;border-radius:18px;padding:16px 12px;cursor:pointer;
  font-size:18px;font-weight:800;transition:.15s;
  background:#f5f7fb;color:#333;min-height:64px
}
.btn:hover{transform:translateY(-2px)}
.btn.active{outline:4px solid #8bbcff;background:#edf6ff}
.primary{background:#6da8ff;color:white;width:100%;margin-top:16px}
.hidden{display:none}
.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.badge{background:#f6f7fb;border-radius:999px;padding:9px 14px;font-weight:800}
.progress{height:12px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:14px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#5ba7ff,#8d7cff)}
.question{font-size:clamp(30px,6vw,52px);font-weight:900;text-align:center;margin:28px 0}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.answer{
  border:2px solid #e6e9ef;background:white;border-radius:18px;
  min-height:70px;font-size:24px;font-weight:900;cursor:pointer;padding:12px
}
.answer.correct{border-color:#35b66a;background:#eafff0}
.answer.wrong{border-color:#ef6a6a;background:#fff0f0}
.feedback{min-height:34px;text-align:center;font-weight:800;margin-top:16px}
.explain{font-size:15px;color:#667085;text-align:center;margin-top:6px}
.next{display:block;margin:16px auto 0;border:none;border-radius:16px;padding:13px 22px;
background:#705cff;color:#fff;font-weight:900;font-size:17px;cursor:pointer}
.small{font-size:14px;color:#7a8492}
.result{text-align:center}
.result h2{font-size:32px}
.wrong-list{text-align:left;background:#fafafa;border-radius:16px;padding:14px;margin-top:14px}
@media(max-width:640px){
 .grid{grid-template-columns:1fr}
 .answers{grid-template-columns:1fr}
 .wrap{padding:12px}
 .panel,.hero{border-radius:20px;padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div style="font-size:46px">🏝️📚🎮</div>
    <h1>穎寶＆美美｜學習冒險島</h1>
    <div class="sub">選年級、選科目、選難度，每次隨機挑戰 10 題！</div>
  </div>

  <div id="setup" class="panel">
    <h3>① 選年級</h3>
    <div class="grid" id="gradeBtns">
      <button class="btn" data-value="1">一年級</button>
      <button class="btn" data-value="2">二年級</button>
      <button class="btn" data-value="3">三年級</button>
    </div>

    <h3>② 選科目</h3>
    <div class="grid" id="subjectBtns">
      <button class="btn" data-value="國語">📖 國語</button>
      <button class="btn" data-value="數學">➕ 數學</button>
      <button class="btn" data-value="生活社會">🌏 生活／社會</button>
    </div>

    <h3>③ 選難度</h3>
    <div class="grid" id="levelBtns">
      <button class="btn" data-value="初級">🌱 初級</button>
      <button class="btn" data-value="中級">🔥 中級</button>
      <button class="btn" data-value="困難">👑 困難</button>
    </div>

    <button id="startBtn" class="btn primary">開始闖關 🚀</button>
    <div id="setupMsg" class="feedback"></div>
  </div>

  <div id="game" class="panel hidden">
    <div class="topbar">
      <div class="badge" id="modeLabel"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="badge">⭐ <span id="score">0</span></div>
        <div class="badge">🔥 Combo <span id="combo">0</span></div>
        <div class="badge">第 <span id="num">1</span>/10 題</div>
      </div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
    <button id="nextBtn" class="next hidden">下一題 ➜</button>
  </div>

  <div id="result" class="panel hidden result">
    <div style="font-size:60px" id="resultEmoji">🏆</div>
    <h2>闖關完成！</h2>
    <div id="resultText"></div>
    <div id="wrongBox" class="wrong-list hidden"></div>
    <button id="retryWrong" class="next hidden">錯題再挑戰 🔁</button>
    <button id="restart" class="next">重新選關卡 🏝️</button>
  </div>
</div>

<script>
const state={grade:null,subject:null,level:null,index:0,score:0,combo:0,questions:[],wrong:[],locked:false};

const bank = {
  "1-數學-初級":[

    q("8 - 8 = ?",0,[0,1,2,8],"全部拿走就剩 0。"),
    q("4 + 5 = ?",9,[7,8,9,10],"4 加 5 等於 9。"),

  "1-國語-困難":[

    q("同學說不想被拍照，你應該？","尊重他",["偷偷拍","強迫他","尊重他","笑他"],"每個人都有拒絕拍照的權利。"),
    q("網路上有人問你的住址，較安全的做法？","不要提供並告訴大人",["直接告訴他","不要提供並告訴大人","只說一半","交換住址"],"個人住址屬於隱私資訊。")
  ]
};

function q(text,answer,options,explain){return {text,answer,options,explain}}

function makeFallback(grade,subject,level){
  const arr=[];
  for(let i=1;i<=14;i++){
    if(subject==="數學"){
      const base=grade*10 + i;
      if(level==="初級") arr.push(q(`${base} + ${grade} = ?`,base+grade,[base+grade-1,base+grade,base+grade+1,base+grade+2],`${base} + ${grade} = ${base+grade}。`));
      else if(level==="中級") arr.push(q(`小朋友有 ${base} 顆貼紙，又得到 ${grade+2} 顆，現在有幾顆？`,base+grade+2,[base+grade+1,base+grade+2,base+grade+3,base+grade+4],`用加法：${base} + ${grade+2}。`));
      else arr.push(q(`有 ${base+8} 顆球，送出 ${grade+3} 顆，又拿回 ${grade} 顆，最後有幾顆？`,base+5,[base+4,base+5,base+6,base+7],`先減再加：${base+8}-${grade+3}+${grade}=${base+5}。`));
    } else if(subject==="國語"){
      const sets = level==="初級" ? [
        ["哪個詞語最完整？","認真學習",["認真學習","認真桌子","學習杯子","跑步天空"]],
        ["「勇敢」較接近哪個意思？","不害怕困難",["不害怕困難","一直睡覺","很會吃飯","沒有聲音"]]
      ] : level==="中級" ? [
        ["「因為天氣很好，所以我們去公園。」去公園的原因？","天氣很好",["天氣很好","忘記帶書","晚上了","下大雨"]],
        ["哪一句語序最自然？","我放學後先寫功課。",["放學我功課先","我放學後先寫功課。","先我功課放學","功課放學我"]]
      ] : [
        ["「雖然下雨，我們還是準時到學校。」這句主要表示？","下雨但仍準時到校",["因為下雨所以沒去","下雨但仍準時到校","今天放假","學校關門"]],
        ["「先整理書包，再檢查功課。」正確順序？","先整理書包",["先檢查功課","先整理書包","同時睡覺","先去玩"]]
      ];
      const s=sets[i%sets.length]; arr.push(q(s[0],s[1],s[2],`答案是「${s[1]}」。`));
    } else {
      const sets = grade<3 ? [
        ["在公共場所應該怎麼做？","遵守規則並尊重別人",["大聲吵鬧","遵守規則並尊重別人","亂丟垃圾","推擠"]],
        ["看到危險情況時較適合？","先遠離並找大人",["靠近看","先遠離並找大人","自己冒險處理","不理會"]]
      ] : [
        ["社區中提供借書服務的場所通常是？","圖書館",["圖書館","消防局","市場","郵局"]],
        ["地圖上的方向標示可以幫助我們？","辨認方向",["辨認方向","計算體重","知道味道","聽音樂"]]
      ];
      const s=sets[i%sets.length]; arr.push(q(s[0],s[1],s[2],`這題重點是生活與社會情境判斷。`));
    }
  }
  return arr;
}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

document.querySelectorAll('#gradeBtns .btn').forEach(b=>b.onclick=()=>selectGroup('gradeBtns',b,'grade'));
document.querySelectorAll('#subjectBtns .btn').forEach(b=>b.onclick=()=>selectGroup('subjectBtns',b,'subject'));
document.querySelectorAll('#levelBtns .btn').forEach(b=>b.onclick=()=>selectGroup('levelBtns',b,'level'));

function selectGroup(id,btn,key){
  document.querySelectorAll(`#${id} .btn`).forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  state[key]=btn.dataset.value;
}

document.getElementById('startBtn').onclick=()=>{
  if(!state.grade||!state.subject||!state.level){
    document.getElementById('setupMsg').textContent='請先把年級、科目、難度都選好喔 😊';
    return;
  }
  startGame();
};

function startGame(customQuestions=null){
  const key=`${state.grade}-${state.subject}-${state.level}`;
  const source=customQuestions || bank[key] || makeFallback(Number(state.grade),state.subject,state.level);
  state.questions=shuffle(source).slice(0,Math.min(10,source.length));
  state.index=0;state.score=0;state.combo=0;state.wrong=[];state.locked=false;
  document.getElementById('score').textContent='0';
  document.getElementById('combo').textContent='0';
  document.getElementById('modeLabel').textContent=`${state.grade}年級｜${state.subject==='生活社會'?(state.grade==='3'?'社會':'生活'):state.subject}｜${state.level}`;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  state.locked=false;
  const item=state.questions[state.index];
  document.getElementById('num').textContent=state.index+1;
  document.getElementById('bar').style.width=`${(state.index/state.questions.length)*100}%`;
  document.getElementById('question').textContent=item.text;
  document.getElementById('feedback').textContent='';
  document.getElementById('explain').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');
  const box=document.getElementById('answers');box.innerHTML='';
  shuffle(item.options).forEach(opt=>{
    const b=document.createElement('button');
    b.className='answer'; b.textContent=opt;
    b.onclick=()=>answer(b,opt,item);
    box.appendChild(b);
  });
}

function answer(btn,opt,item){
  if(state.locked)return;
  state.locked=true;
  const all=[...document.querySelectorAll('.answer')];
  all.forEach(b=>b.disabled=true);
  if(String(opt)===String(item.answer)){
    btn.classList.add('correct'); state.score++;state.combo++;
    document.getElementById('feedback').textContent=state.combo>=3?'🎉 連續答對！太強了！':'✅ 答對了！得到 1 顆星星';
  }else{
    btn.classList.add('wrong');state.combo=0;state.wrong.push(item);
    all.forEach(b=>{if(String(b.textContent)===String(item.answer))b.classList.add('correct')});
    document.getElementById('feedback').textContent=`💡 正確答案：${item.answer}`;
  }
  document.getElementById('score').textContent=state.score;
  document.getElementById('combo').textContent=state.combo;
  document.getElementById('explain').textContent=item.explain||'';
  const n=document.getElementById('nextBtn');
  n.textContent=state.index===state.questions.length-1?'看成績 🏆':'下一題 ➜';
  n.classList.remove('hidden');
}

document.getElementById('nextBtn').onclick=()=>{
  if(state.index<state.questions.length-1){state.index++;renderQuestion()}
  else finish();
};

function finish(){
  document.getElementById('bar').style.width='100%';
  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const total=state.questions.length, pct=Math.round(state.score/total*100);
  document.getElementById('resultEmoji').textContent=pct===100?'👑':pct>=80?'🌟':pct>=60?'👏':'💪';
  document.getElementById('resultText').innerHTML=`答對 <b>${state.score} / ${total}</b> 題｜正確率 <b>${pct}%</b>｜得到 ⭐ <b>${state.score}</b>`;
  const box=document.getElementById('wrongBox');
  const retry=document.getElementById('retryWrong');
  if(state.wrong.length){
    box.classList.remove('hidden');
    box.innerHTML='<b>這次的錯題：</b><br>'+state.wrong.map((x,i)=>`${i+1}. ${x.text} → ${x.answer}`).join('<br>');
    retry.classList.remove('hidden');
  }else{
    box.classList.add('hidden');retry.classList.add('hidden');
  }
}

document.getElementById('retryWrong').onclick=()=>{
  const w=[...state.wrong];
  startGame(w);
};

document.getElementById('restart').onclick=()=>{
  document.getElementById('result').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('setupMsg').textContent='';
};
</script>
